networks:
  fetchrr_net:
    external: true

services:
  #===========================================================#
  gluetun:
    container_name: gluetun
    hostname: mediagluetun
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    ports:
      - 8090:8090 # qbittorrent
      # - 8989:8989 # sonarr
      # - 9696:9696 # prowlarr
      # - 7878:7878 # radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VPN_SERVICE_PROVIDER=protonvpn
      - TZ=${TZ}
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24 #Allow access to local containers
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'echo Updating qBittorrent port to {{PORTS}} && wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8090/api/v2/app/setPreferences 2>&1'

      ### Wireguard Settings
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=$wgPrivateKey
      - SERVER_COUNTRIES=$country
      # - SERVER_HOSTNAMES=node-ca-13.protonvpn.net
    volumes:
      - /volume2/docker/gluetun:/gluetun
    networks:
      - fetchrr_net
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
  #===========================================================#
  gluetun2:
    container_name: gluetun2
    hostname: mediagluetun
    image: qmcgaw/gluetun:latest
    restart: unless-stopped
    ports:
      - 8092:8092 # qbittorrent
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - VPN_SERVICE_PROVIDER=protonvpn
      - TZ=${TZ}
      - VPN_PORT_FORWARDING=on
      - PORT_FORWARD_ONLY=on
      - FIREWALL_OUTBOUND_SUBNETS=192.168.1.0/24 #Allow access to local containers
      - VPN_PORT_FORWARDING_UP_COMMAND=/bin/sh -c 'echo Updating qBittorrent port to {{PORTS}} && wget -O- --retry-connrefused --post-data "json={\"listen_port\":{{PORTS}}}" http://127.0.0.1:8092/api/v2/app/setPreferences 2>&1'

      ### Wireguard Settings
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=$wgPrivateKey2
      - SERVER_COUNTRIES=$country
      # - SERVER_HOSTNAMES=node-ca-13.protonvpn.net
    volumes:
      - /volume2/docker/gluetun2:/gluetun
    networks:
      - fetchrr_net
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun

  #===========================================================
  qbittorrent:
    container_name: qbittorrent
    image: lscr.io/linuxserver/qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
      - WEBUI_PORT=8090
      # - DOCKER_MODS=arafatamim/linuxserver-io-mod-vuetorrent
    volumes:
      - /volume2/docker/qbittorrent/config:/config
      - /volume1/Media:/data
    # depends_on:
    #   - gluetun
    network_mode: service:gluetun # Use the VPN network
    # networks:
    #   - fetchrr_net

  #===========================================================#
  qbittorrent2:
    container_name: qbittorrent2
    image: lscr.io/linuxserver/qbittorrent
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
      - WEBUI_PORT=8092
      # - DOCKER_MODS=arafatamim/linuxserver-io-mod-vuetorrent
    volumes:
      - /volume2/docker/qbittorrent2/config:/config
      - /volume1/Media:/data
    # depends_on:
    #   - gluetun
    network_mode: service:gluetun2 # Use the VPN network
    # networks:
    #   - fetchrr_net
  #===========================================================#
  prowlarr:
    container_name: prowlarr
    image: lscr.io/linuxserver/prowlarr:develop
    restart: unless-stopped
    ports:
      - 9696:9696
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /volume2/docker/prowlarr/config:/config
      - /volume1/Media:/data
    depends_on:
      gluetun:
        condition: service_healthy
    # network_mode: service:gluetun # Use the VPN network
    networks:
      - fetchrr_net
  #===========================================================#
  radarr:
    container_name: radarr
    image: ghcr.io/hotio/radarr:latest
    restart: unless-stopped
    ports:
      - 7878:7878
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /volume2/docker/radarr/config:/config
      - /volume1/Media:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      gluetun:
        condition: service_healthy
    # network_mode: service:gluetun # Use the VPN network
    networks:
      - fetchrr_net
    logging:
      driver: json-file
  #===========================================================#
  sonarr-anime:
    container_name: sonarr-anime
    image: ghcr.io/hotio/sonarr:latest
    restart: unless-stopped
    ports:
      - 8989:8989
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /volume2/docker/sonarr/config:/config # existing config, kept in place
      - /volume1/Media:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      gluetun:
        condition: service_healthy
    # network_mode: service:gluetun # Use the VPN network
    networks:
      - fetchrr_net
    logging:
      driver: json-file
  #===========================================================#
  sonarr-tv:
    container_name: sonarr-tv
    image: ghcr.io/hotio/sonarr:latest
    restart: unless-stopped
    ports:
      - 8990:8989
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /volume2/docker/sonarr-tv/config:/config
      - /volume1/Media:/data
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      gluetun:
        condition: service_healthy
    # network_mode: service:gluetun # Use the VPN network
    networks:
      - fetchrr_net
    logging:
      driver: json-file
  #===========================================================#
  bazarr:
    container_name: bazarr
    image: ghcr.io/hotio/bazarr:latest
    restart: unless-stopped
    ports:
      - 6767:6767/tcp
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /volume2/docker/bazarr/config:/config
      - /volume1/Media/media:/data/media
      - /etc/localtime:/etc/localtime:ro
    networks:
      - fetchrr_net
  #===========================================================#
  bazarr-tv:
    container_name: bazarr-tv
    image: ghcr.io/hotio/bazarr:latest
    restart: unless-stopped
    ports:
      - 6768:6767/tcp
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - /volume2/docker/bazarr-tv/config:/config
      - /volume1/Media/media:/data/media
      - /etc/localtime:/etc/localtime:ro
    networks:
      - fetchrr_net
  #===========================================================#
  seerr:
    container_name: seerr
    image: ghcr.io/seerr-team/seerr:latest
    init: true
    restart: unless-stopped
    ports:
      - 5055:5055
    environment:
      - TZ=${TZ}
      - LOG_LEVEL=info
    volumes:
      - /volume2/docker/seerr/config:/app/config
    networks:
      - fetchrr_net
  #===========================================================#
  doplarr:
    container_name: doplarr
    image: ghcr.io/activexray/doplarr_rs:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - DISCORD__TOKEN=${bot_token}
      - OVERSEERR__URL=http://seerr:5055
      - OVERSEERR__API=${seer_api_token}
    volumes:
      - /volume2/docker/doplarr/config:/config
    depends_on:
      - seerr
    networks:
      - fetchrr_net
  #===========================================================#
