# Changes to the Portainer stack. Values come from Portainer's stack environment variables
# (same as doplarr already does) — never paste secret values into the YAML itself.

# ---------------------------------------------------------------------------
# 1) radarr  — add an environment block entry (keep the existing ones)
# ---------------------------------------------------------------------------
#    environment:
#      - PUID=${PUID}
#      - PGID=${PGID}
#      - TZ=${TZ}
#      - CHURN_WEBHOOK_URL=${CHURN_WEBHOOK_URL}      # same Discord webhook; bot name is set per message
#      - RADARR_PUBLIC_URL=${RADARR_PUBLIC_URL}      # NEW stack variable, e.g. http://<nas-ip>:7878

# ---------------------------------------------------------------------------
# 2) sonarr-anime — the variable inside the container keeps the name SONARR_PUBLIC_URL
#    (that's what the script reads), but it's fed from a NEW stack variable so it
#    doesn't point at sonarr-tv's URL.
# ---------------------------------------------------------------------------
#    environment:
#      - PUID=${PUID}
#      - PGID=${PGID}
#      - TZ=${TZ}
#      - CHURN_WEBHOOK_URL=${CHURN_WEBHOOK_URL}
#      - SONARR_PUBLIC_URL=${SONARR_ANIME_PUBLIC_URL}   # NEW stack variable, e.g. http://<nas-ip>:8989

# ---------------------------------------------------------------------------
# 3) NEW service: arr-ops  (paste under services:)
#    Image is built once on the NAS (see README step 2), so pull_policy: never.
# ---------------------------------------------------------------------------
  arr-ops:
    container_name: arr-ops
    image: arr-ops:local
    pull_policy: never
    init: true
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      # Sonarr TV
      - SONARR_TV_URL=http://sonarr-tv:8989
      - SONARR_TV_API_KEY=${sonarr_tv_api_key}
      - SONARR_TV_PUBLIC_URL=${SONARR_PUBLIC_URL}
      # Sonarr Anime
      - SONARR_ANIME_URL=http://sonarr-anime:8989
      - SONARR_ANIME_API_KEY=${sonarr_anime_api_key}
      - SONARR_ANIME_PUBLIC_URL=${SONARR_ANIME_PUBLIC_URL}
      # Radarr
      - RADARR_URL=http://radarr:7878
      - RADARR_API_KEY=${radarr_api_key}
      - RADARR_PUBLIC_URL=${RADARR_PUBLIC_URL}
      # Prowlarr
      - PROWLARR_URL=http://prowlarr:9696
      - PROWLARR_API_KEY=${prowlarr_api_key}
      # qBittorrent — address each by its OWN gluetun container (not "mediagluetun", see README)
      - QBIT_PUBLIC_URL=http://gluetun:8090
      - QBIT_PRIVATE_URL=http://gluetun2:8092
      - QBIT_USER=${qbit_user}
      - QBIT_PUBLIC_PASSWORD=${qbit_password}
      - QBIT_PRIVATE_PASSWORD=${qbit2_password}
      # Bazarr x2, Seerr (optional — leave the stack variables empty if unused)
      - BAZARR_URL=http://bazarr:6767
      - BAZARR_API_KEY=${bazarr_api_key}
      - BAZARR_TV_URL=http://bazarr-tv:6767
      - BAZARR_TV_API_KEY=${bazarr_tv_api_key}
      - SEERR_URL=http://seerr:5055
      - SEERR_API_KEY=${seerr_api_key}
      # Plex on the NAS itself, default port. 172.19.0.1 = fetchrr_net gateway (= the host);
      # the LAN IP 192.168.1.187 is NOT reachable from containers on this network.
      - PLEX_URL=http://172.19.0.1:32400
      - PLEX_TOKEN=${plex_token}
      # Discord alerts
      - CHURN_WEBHOOK_URL=${CHURN_WEBHOOK_URL}
    volumes:
      - /volume2/docker/arr-ops/home:/home/ops          # Claude Code install, login, memory, shell history
      - /volume2/docker/arr-ops/workspace:/workspace    # scripts, crontab, state, logs, CLAUDE.md
      - /volume1/Media:/data                            # same view of media/torrents as the apps (hardlinks work)
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      - sonarr-tv
      - sonarr-anime
      - radarr
    networks:
      - fetchrr_net
